<div class="page">
  <h2>{{ editing ? 'Edit Product' : 'Create Product' }}</h2>

  <div *ngIf="loadingData" class="loading-msg">Loading form data...</div>

  <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" formControlName="name" placeholder="Product name" />
    </div>

    <div class="form-group">
      <label for="unitPrice">Unit Price</label>
      <input id="unitPrice" type="number" formControlName="unitPrice" min="0" step="0.01" />
    </div>

    <div class="form-group">
      <label for="reorderLevel">Reorder Level</label>
      <input id="reorderLevel" type="number" formControlName="reorderLevel" min="0" />
    </div>

    <div class="form-group">
      <label for="currentStock">Current Stock</label>
      <input id="currentStock" type="number" formControlName="currentStock" min="0" />
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" formControlName="status">
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
        <option value="DISCONTINUED">DISCONTINUED</option>
      </select>
    </div>

    <div class="form-group">
      <label for="categoryId">Category</label>
      <select id="categoryId" formControlName="categoryId">
        <option [ngValue]="null" disabled>-- Select Category --</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="supplierId">Supplier</label>
      <select id="supplierId" formControlName="supplierId">
        <option [ngValue]="null" disabled>-- Select Supplier --</option>
        <option *ngFor="let sup of suppliers" [ngValue]="sup.id">{{ sup.name }}</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>

  <div *ngIf="error" class="error">{{ error }}</div>
</div>
