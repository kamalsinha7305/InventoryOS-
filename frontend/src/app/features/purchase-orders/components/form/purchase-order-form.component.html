<div class="page">
  <h2>Create Purchase Order</h2>

  <div *ngIf="loadingData" class="loading-msg">Loading form data...</div>

  <form *ngIf="!loadingData" [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-group">
      <label for="supplierId">Supplier</label>
      <select id="supplierId" formControlName="supplierId">
        <option [ngValue]="null" disabled>-- Select Supplier --</option>
        <option *ngFor="let s of suppliers" [ngValue]="s.id">{{ s.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="warehouseId">Warehouse</label>
      <select id="warehouseId" formControlName="warehouseId">
        <option [ngValue]="null" disabled>-- Select Warehouse --</option>
        <option *ngFor="let w of warehouses" [ngValue]="w.id">{{ w.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="productId">Product</label>
      <select id="productId" formControlName="productId">
        <option [ngValue]="null" disabled>-- Select Product --</option>
        <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }} ({{ p.sku }})</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input id="quantity" type="number" formControlName="quantity" min="1" />
    </div>

    <div class="form-group">
      <label for="unitCost">Unit Cost</label>
      <input id="unitCost" type="number" formControlName="unitCost" min="0" step="0.01" />
    </div>

    <div class="actions">
      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Creating...' : 'Create' }}
      </button>
      <button type="button" (click)="cancel()">Cancel</button>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</div>
